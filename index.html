<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Pinch-zoom is left enabled on purpose: this runs on phones in a
         workshop, and blocking zoom stops anyone enlarging a plate number or a
         figure on an invoice. The focus-zoom that user-scalable=no used to
         suppress is handled properly in styles/index.css by giving mobile
         inputs a 16px font size, which is what actually triggers it.
         viewport-fit=cover pairs with the safe-area padding further down. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Malibora Truck Clinic</title>
    <meta name="description" content="Professional Vehicle Service & Repair Management System - Malibora Truck Clinic, Arusha, Tanzania" />
    <meta name="theme-color" content="#c95c0c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Malibora" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
